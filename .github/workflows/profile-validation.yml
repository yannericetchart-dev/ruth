name: Ruth portable CUDA profile PR checks

on:
  push:
    branches: [model-profiling]
  pull_request:
    branches: [model-profiling]
    paths:
      - "profiles/submissions/**"
      - "profiles/measurements/**"
      - "profiles/models/**"
      - "ruth_runtime/model_profile_v2.py"
      - "ruth_runtime/canonical_profile_git.py"
      - "catalog/quantization_policy.json"
      - "tests/test_phase20_canonical_profiles.py"
      - "tests/test_phase22_gemma3_bf16_onboarding.py"
      - "ruth_runtime/gguf_header_inspection.py"
      - "tests/test_phase23_gemma3_gguf_header.py"
      - "ruth_runtime/hardware_eligibility.py"
      - "ruth_runtime/model_memory_profiles.py"
      - "ruth_runtime/profile_registry.py"
      - "ruth_runtime/profile_contribution.py"
      - "catalog/nvidia_architecture_policy.json"
      - "catalog/gpu_capacity_profiles.json"
      - "tests/test_phase1[12345678]*.py"
      - "ruth_runtime/llama_kv_profile.py"
      - "ruth_runtime/llama_kv_log.py"
      - "ruth_runtime/load_only_worker.py"
      - "ruth_runtime/load_only_probe.py"
      - "ruth_runtime/probe_profile_sync.py"
      - "tests/test_phase19_probe_auto_record.py"
      - "ruth_runtime/cuda_adapter.py"
      - "tests/test_phase02_cuda_adapter.py"
      - "catalog/llama_kv_backend_policy.json"
      - "ruth_runtime/offline_memory_fit.py"
      - "ruth_runtime/production_selection.py"
      - "ruth_runtime/candidate_selection.py"
      - "ruth_runtime/model_catalog.py"

permissions:
  contents: read

jobs:
  validate-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate hardware and publication regression tests
        run: |
          python -m unittest \
            tests.test_phase02_cuda_adapter \
            tests.test_phase11_load_only_probe \
            tests.test_phase12_model_memory_profiles \
            tests.test_phase13_hardware_architecture \
            tests.test_phase14_profile_registry \
            tests.test_phase15_profile_contribution \
            tests.test_phase16_offline_memory_fit \
            tests.test_phase17_auto_production \
            tests.test_phase18_llama_kv_profile \
            tests.test_phase19_probe_auto_record \
            tests.test_phase20_canonical_profiles \
            tests.test_phase22_gemma3_bf16_onboarding \
            tests.test_phase23_gemma3_gguf_header -v
      - name: Validate submitted and owner-measured JSON files (offline)
        shell: bash
        run: |
          shopt -s nullglob
          for file in profiles/submissions/*/*.json profiles/measurements/*/*.json; do
            python -m ruth_runtime.profile_contribution --validate "$file"
          done
