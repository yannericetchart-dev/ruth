name: Verify Ruth Python and dependencies
on:
  pull_request:
    branches: [main, environment/main, environment/dependencies/main, environment/diagnostics/main, hardware/main, hardware/cpu/main, hardware/gpu/main, hardware/gpu/nvidia/main, models/main, models/catalog/main, models/formats/main, models/formats/gguf/main]
  push:
    branches: [main, environment/main, environment/dependencies/main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python isolation tests
        run: |
          if [ -f environment/python/tests/test_inspection.py ]; then
            python3 -m unittest discover -s environment/python/tests -v
          fi
      - name: Dependency component tests
        run: python3 -m unittest discover -s environment/dependencies/tests -v
      - name: Environment diagnostics tests
        run: |
          if [ -f environment/diagnostics/tests/test_inspection.py ]; then
            python3 -m unittest discover -s environment/diagnostics/tests -v
          fi
      - name: CPU inventory tests
        run: python3 -m unittest discover -s hardware/cpu/tests -v
      - name: Hardware inventory tests
        run: python3 -m unittest discover -s hardware/tests -v
      - name: NVIDIA GPU provider tests
        run: python3 -m unittest discover -s hardware/gpu/nvidia/tests -v
      - name: Model catalog component tests
        run: python3 -m unittest discover -s models/catalog/tests -v
      - name: GGUF header-only component tests
        run: python3 -m unittest discover -s models/formats/gguf/tests -v
      - name: GGUF metadata component tests
        run: python3 -m unittest discover -s models/formats/gguf/tests -p 'test_metadata.py' -v
      - name: Root tests and entrypoint
        run: python3 -m unittest discover -s tests -v
      - name: Check generated maps
        run: python3 tools/maps.py --check
      - name: Verify no generated tracked changes
        run: git diff --exit-code
